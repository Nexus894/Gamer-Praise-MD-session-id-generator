<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gamer-Praise-MD • Session Generator</title>
<style>
  :root {
    --bg:#0d1117; --card:#161b22; --line:#30363d;
    --fg:#e6edf3; --muted:#8b949e;
    --acc:#2ea043; --acc2:#58a6ff; --err:#f85149;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2030 0%, var(--bg) 60%);
    color:var(--fg); min-height:100vh;
    display:grid; place-items:center; padding:24px;
  }
  .card {
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:28px; width:100%; max-width:520px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { margin:0 0 6px; font-size:20px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
  label { display:block; font-size:13px; margin-bottom:6px; color:var(--muted); }
  input {
    width:100%; padding:12px 14px; border-radius:10px;
    border:1px solid var(--line); background:#0d1117; color:var(--fg);
    font-size:14px; outline:none; transition:border-color .15s;
  }
  input:focus { border-color:var(--acc2); }
  button {
    width:100%; margin-top:14px; padding:12px; border-radius:10px; border:0;
    background:linear-gradient(180deg,#3fb950,#2ea043); color:#fff;
    font-weight:600; font-size:14px; cursor:pointer; transition:opacity .15s;
  }
  button:hover:not(:disabled) { opacity:.92; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size:24px; letter-spacing:3px;
    background:#0d1117; border:1px dashed var(--line);
    padding:16px; border-radius:10px; text-align:center; margin-top:14px;
    color:var(--acc2); word-break:break-all;
  }
  .hint { color:var(--muted); font-size:12px; margin-top:10px; line-height:1.5; }
  .out {
    margin-top:14px; font-size:13px; padding:14px; border-radius:10px;
    background:#0d1117; border:1px solid var(--line); word-break:break-all;
    line-height:1.5;
  }
  .out code { font-size:12px; color:#7ee787; }
  .ok  { border-color:var(--acc); }
  .err { border-color:var(--err); color:#ff7b72; }
  .spin {
    display:inline-block; width:12px; height:12px; border-radius:50%;
    border:2px solid #2ea043; border-top-color:transparent;
    animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>⚡ Gamer-Praise-MD</h1>
    <div class="sub">Generate your Session ID (WhatsApp pairing)</div>

    <label>WhatsApp number (with country code, digits only)</label>
    <input id="phone" placeholder="e.g. 2348012345678" autocomplete="off" />
    <button id="go">Generate Pairing Code</button>

    <div id="codeBox" class="code" style="display:none"></div>
    <div class="hint" id="hint" style="display:none">
      Enter this code in WhatsApp → Linked Devices → Link with phone number.
    </div>

    <div id="out" class="out" style="display:none"></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let poll = null;

$("go").addEventListener("click", async () => {
  const phone = $("phone").value.trim();
  if (!phone) return;

  $("go").disabled = true;
  $("codeBox").style.display = "none";
  $("hint").style.display = "none";
  $("out").style.display = "none";

  const r = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ phoneNumber: phone })
  }).then(r => r.json()).catch(() => null);

  if (!r || !r.jobId) {
    $("out").className = "out err";
    $("out").textContent = "❌ Failed to start generation.";
    $("out").style.display = "block";
    $("go").disabled = false;
    return;
  }

  $("out").className = "out";
  $("out").innerHTML = `<span class="spin"></span> Starting session…`;
  $("out").style.display = "block";

  poll = setInterval(() => checkStatus(r.jobId), 2000);
});

async function checkStatus(jobId) {
  const s = await fetch(`/api/status/${jobId}`)
    .then(r => r.json())
    .catch(() => null);
  if (!s) return;

  if (s.pairingCode && $("codeBox").style.display === "none") {
    $("codeBox").textContent = s.pairingCode;
    $("codeBox").style.display = "block";
    $("hint").style.display = "block";
    $("out").innerHTML = `<span class="spin"></span> Waiting for you to link on WhatsApp…`;
  }

  if (s.status === "ready") {
    clearInterval(poll);
    $("go").disabled = false;
    $("out").className = "out ok";
    $("out").innerHTML =
      `<b>✅ Session ID ready for +${s.number}</b><br><br>` +
      `<code>${s.sessionId}</code><br><br>` +
      `Copy this into <b>config.js</b> → <code>sessionId</code>`;
  }

  if (s.status === "error") {
    clearInterval(poll);
    $("go").disabled = false;
    $("out").className = "out err";
    $("out").textContent = "❌ " + (s.error || "Unknown error.");
  }
}
</script>
</body>
</html>
